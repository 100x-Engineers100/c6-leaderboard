name: Weekly Leaderboard Sync

on:
  schedule:
    # Every Sunday 18:30 UTC (midnight IST)
    - cron: '30 18 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync (weekly) or bulk (full historical import)'
        required: false
        default: 'sync'
        type: choice
        options:
          - sync
          - bulk

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run weekly sync
        if: ${{ github.event.inputs.mode != 'bulk' }}
        run: node scripts/sync-weekly.mjs
        env:
          LEADERBOARD_SUPABASE_URL:     ${{ secrets.LEADERBOARD_SUPABASE_URL }}
          LEADERBOARD_SUPABASE_SERVICE_KEY: ${{ secrets.LEADERBOARD_SUPABASE_SERVICE_KEY }}
          UGC_SUPABASE_URL:             ${{ secrets.UGC_SUPABASE_URL }}
          UGC_SUPABASE_SERVICE_KEY:     ${{ secrets.UGC_SUPABASE_SERVICE_KEY }}
          EDMINGLE_BASE_URL:            ${{ secrets.EDMINGLE_BASE_URL }}
          EDMINGLE_API_KEY:             ${{ secrets.EDMINGLE_API_KEY }}
          EDMINGLE_ORG_ID:              ${{ secrets.EDMINGLE_ORG_ID }}
          C7_BATCH_ID:                  ${{ secrets.C7_BATCH_ID }}

      - name: Run bulk historical import
        if: ${{ github.event.inputs.mode == 'bulk' }}
        run: node scripts/bulk-import.mjs
        env:
          LEADERBOARD_SUPABASE_URL:     ${{ secrets.LEADERBOARD_SUPABASE_URL }}
          LEADERBOARD_SUPABASE_SERVICE_KEY: ${{ secrets.LEADERBOARD_SUPABASE_SERVICE_KEY }}
          UGC_SUPABASE_URL:             ${{ secrets.UGC_SUPABASE_URL }}
          UGC_SUPABASE_SERVICE_KEY:     ${{ secrets.UGC_SUPABASE_SERVICE_KEY }}
          EDMINGLE_BASE_URL:            ${{ secrets.EDMINGLE_BASE_URL }}
          EDMINGLE_API_KEY:             ${{ secrets.EDMINGLE_API_KEY }}
          EDMINGLE_ORG_ID:              ${{ secrets.EDMINGLE_ORG_ID }}
          C7_BATCH_ID:                  ${{ secrets.C7_BATCH_ID }}
